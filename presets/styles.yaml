# Style presets for the reference-image prompt builder and the default optimisation budgets.
# Each preset contributes: a short UI description, a style clause for the image prompt, material/palette defaults,
# background colour, extra negatives, and optimisation defaults. Application-level only: nothing here is forwarded
# verbatim to a backend. Keys are referenced by the API/CLI (`style`) and the portal.
#
# lod_fractions stays at 0.5/0.25: ask for the LOD chain you actually want and let the pipeline deal with what the
# reducer can reach, rather than pre-weakening every asset. LODs reuse LOD0's texture set, so they must keep its UV
# layout, and meshoptimizer will not collapse an edge lying on a UV border - after an atlas bake every seam is one.
# Measured on a 19,415-triangle atlas-baked car (var/lod_fractions_sweep.py): the reducer cannot get below ~67% of
# LOD0 at all, and a chained second level stalls at ~65%, so there LOD1 lands near 0.58 and LOD2 would be a
# near-duplicate. process_asset handles exactly that case: a level that comes out within 10% of the one above it is
# not exported (it appears under lods_skipped in the manifest instead - each LOD carries its own multi-MB copy of
# the shared textures, so a duplicate level costs far more than it saves), and only a level missing its budget by
# more than 25% is warned about. Meshes with a friendlier UV layout do reach 0.5/0.25 exactly. Override per request
# (`lod_fractions`) when a project needs different budgets.
mobile_factory:
  label: "Stylized factory game"
  description: "Chunky, readable machines and props for a factory-builder. Bold silhouettes, painted metal, limited palette."
  best_for: "Machines, conveyors, tanks, crates and buildings that must read at a small on-screen size."
  style_clause: >
    stylized game asset for a mobile factory-building game, chunky simplified forms with a strong readable
    silhouette, controlled detail level, slightly exaggerated proportions, soft bevelled edges, clean
    hand-painted PBR look with subtle edge wear, coherent limited colour palette, no tiny protrusions,
    no thin wires or cables
  default_materials: "painted metal, brushed copper accents, matte concrete"
  default_palette: ["teal", "copper", "warm grey"]
  background: "plain flat light grey studio background"
  negative_extra: "photorealistic grime, tangled cables, tiny greebles, thin antennae, cluttered details, painted lettering, warning text"
  optimize_defaults:
    target_triangles: 20000
    texture_size: 2048
    lod_fractions: [0.5, 0.25]
    collision_triangles: 200
stylized_generic:
  label: "Stylized"
  description: "Hand-painted look with appealing proportions. Works for most props, characters' gear, furniture and vehicles."
  best_for: "General game props when you do not need the factory look or photo-realism."
  style_clause: >
    stylized 3D game asset, clean readable shapes, hand-painted PBR materials, appealing proportions,
    moderate detail, coherent palette
  default_materials: ""
  default_palette: []
  background: "plain flat light grey studio background"
  negative_extra: "clutter, tiny greebles"
  optimize_defaults: {target_triangles: 30000, texture_size: 2048, lod_fractions: [0.5, 0.25], collision_triangles: 256}
realistic:
  label: "Realistic"
  description: "Physically plausible materials, proportions and light wear, like a product photo of the real thing."
  best_for: "Tools, furniture, vehicles, architecture pieces and anything meant to look believable."
  style_clause: >
    realistic 3D prop, physically plausible materials and proportions, moderate surface wear, product-shot clarity
  default_materials: ""
  default_palette: []
  background: "plain flat neutral grey studio background"
  negative_extra: "cartoon, toy-like, exaggerated proportions"
  optimize_defaults: {target_triangles: 40000, texture_size: 2048, lod_fractions: [0.5, 0.25], collision_triangles: 256}
lowpoly:
  label: "Low-poly"
  description: "Flat-shaded facets and solid colours. Very small triangle budgets; detail comes from shape, not texture."
  best_for: "Trees, rocks, simple props and mobile/retro looks where a few thousand triangles is the target."
  style_clause: >
    low-poly 3D game asset, flat-shaded faceted surfaces, simple geometric forms, solid flat colours,
    minimal texture detail, strong silhouette
  default_materials: "flat matte plastic-like surfaces"
  default_palette: []
  background: "plain flat light grey studio background"
  negative_extra: "fine texture detail, realistic grime, smooth organic curves"
  optimize_defaults: {target_triangles: 6000, texture_size: 1024, lod_fractions: [0.5, 0.25], collision_triangles: 128}
clean_product:
  label: "Clean product"
  description: "Catalogue-style render of a manufactured object: precise smooth surfaces, accurate materials, no wear."
  best_for: "Consumer goods, appliances, packaging, mugs and bottles, hard-surface items with a factory finish."
  style_clause: >
    clean product-visualisation render of a single manufactured object, precise smooth surfaces,
    accurate materials, catalogue clarity
  default_materials: ""
  default_palette: []
  background: "plain flat white studio background"
  negative_extra: "wear, dirt, scratches, stylization"
  optimize_defaults: {target_triangles: 30000, texture_size: 2048, lod_fractions: [0.5, 0.25], collision_triangles: 256}
scifi:
  label: "Sci-fi hard surface"
  description: "Panelled hard-surface design with emissive accents and machined details, clean and readable."
  best_for: "Crates, terminals, drones, weapons props, modular station parts."
  style_clause: >
    sci-fi hard-surface game asset, clean panel lines and bevels, machined metal and composite panels,
    a few emissive accent strips, readable silhouette, moderate detail density
  default_materials: "brushed metal, matte composite panels, emissive accents"
  default_palette: ["gunmetal", "off-white", "cyan accent"]
  background: "plain flat dark grey studio background"
  negative_extra: "tangled cables, tiny greebles, holographic screens, text panels"
  optimize_defaults: {target_triangles: 30000, texture_size: 2048, lod_fractions: [0.5, 0.25], collision_triangles: 256}
fantasy:
  label: "Fantasy"
  description: "Hand-crafted medieval and magical props: worn wood, forged iron, stone, leather, warm painted look."
  best_for: "Chests, barrels, weapons, lanterns, potions, market stalls, ruins pieces."
  style_clause: >
    stylized fantasy game prop, hand-crafted look with worn wood, forged iron, carved stone and leather,
    slightly exaggerated proportions, warm hand-painted PBR textures, readable silhouette
  default_materials: "worn wood, forged iron, leather"
  default_palette: ["oak brown", "iron grey", "brass"]
  background: "plain flat light grey studio background"
  negative_extra: "modern materials, plastic, photorealistic grime, runes with text"
  optimize_defaults: {target_triangles: 30000, texture_size: 2048, lod_fractions: [0.5, 0.25], collision_triangles: 256}
