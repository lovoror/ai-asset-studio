# Example prompts shown in the portal's Create page. Each is a complete, reconstruction-friendly single-object idea.
# `style` refers to presets/styles.yaml; height/triangles are suggestions that pre-fill the 3D settings.
- id: pump_station
  title: Industrial water pump station
  prompt: Stylized industrial water pump station for a mobile factory-building game, chunky readable silhouette, painted teal metal, copper pipes, small concrete foundation
  style: mobile_factory
  height_m: 2.0
  target_triangles: 20000
